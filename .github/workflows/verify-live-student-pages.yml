# Asks the live site, from somewhere that can reach it, whether the student
# redesign is actually being served.
#
# The assistant's sandbox cannot open the production hosts at all — the egress
# policy refuses CONNECT — so "is it live?" cannot be answered from there. A
# runner can reach it. This fetches the public sign-in page and the stylesheet
# the deployed build links, and looks for the class names the redesign
# introduced. It reads; it never signs in, never writes, and touches no data.
name: Verify the live student pages

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'The website to ask.'
        required: true
        default: 'https://courses-platform-web.vercel.app'
        type: string

jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the pages and the stylesheet, and report what is there
        env:
          SITE: ${{ inputs.site_url }}
        run: |
          set -u
          fail=0

          echo "=== routes ==="
          for path in / /login /home /games /dashboard /progress /students /content; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' -m 40 "$SITE$path" || echo 000)
            printf '%-12s HTTP %s\n' "$path" "$code"
            case "$path" in
              /login) cp /tmp/page.html /tmp/login.html ;;
              /dashboard|/progress|/students|/content) cp /tmp/page.html "/tmp/teacher$(echo "$path" | tr / _).html" ;;
            esac
            if [ "$code" != "200" ]; then echo "  ^ not 200"; fail=1; fi
          done

          echo
          echo "=== the approved sign-in wording, on the live page ==="
          for phrase in "Your English Journey" "Starts Here" "Learn, practise, and grow with TOP GOAL."; do
            if grep -qF "$phrase" /tmp/login.html; then echo "found: $phrase"; else echo "MISSING: $phrase"; fail=1; fi
          done

          echo
          echo "=== the stylesheet the deployed build links ==="
          css=$(grep -o '/_next/static/css/[A-Za-z0-9._-]*\.css' /tmp/login.html | head -1)
          echo "css: ${css:-none found}"
          if [ -z "$css" ]; then fail=1; else
            curl -s -m 40 "$SITE$css" -o /tmp/app.css
            echo "bytes: $(wc -c < /tmp/app.css)"
            for cls in trailhead signin-panel valley-hold trail-stop trail-mark unit-world games-world q-jump q-pip trail-parts; do
              if grep -qF ".$cls" /tmp/app.css; then echo "present: .$cls"; else echo "MISSING: .$cls"; fail=1; fi
            done
          fi

          echo
          echo "=== teacher and admin routes carry no student-world markup ==="
          for f in /tmp/teacher_dashboard.html /tmp/teacher_progress.html /tmp/teacher_students.html /tmp/teacher_content.html; do
            [ -f "$f" ] || continue
            hits=$(grep -o -E 'class="[^"]*(valley-hold|trail-stop|unit-world|games-world)[^"]*"' "$f" | wc -l)
            printf '%-32s student-world classes in markup: %s\n' "$(basename "$f")" "$hits"
            if [ "$hits" != "0" ]; then fail=1; fi
          done

          echo
          if [ "$fail" = "0" ]; then echo "ALL LIVE CHECKS PASSED"; else echo "SOME LIVE CHECKS FAILED"; fi
          exit "$fail"
