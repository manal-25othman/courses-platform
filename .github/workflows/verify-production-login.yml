# Asks why a sign-in was refused, from inside.
#
# The API answers every failed sign-in with one sentence — "Incorrect username
# or password" — whether the account does not exist, the password is wrong, or
# the name was typed in the wrong shape. That is deliberate: anything more
# would let a stranger discover which usernames are real. It also means the
# person staring at the message cannot tell which of the three happened.
#
# With the credentials the deployment was given, all three can be told apart.
# This does, and reports only which one it is: no password, no address, no
# hash, no token is ever printed.
name: Verify the production sign-in

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'The website, which carries the API.'
        required: true
        default: 'https://courses-platform-web.vercel.app'
        type: string
      repair_operator_password:
        description: 'Reset the operator password from the current secret, if and only if it does not already match.'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate the database client
        run: npm run db:generate

      # Runs first, because it changes what the check below is checking. It
      # only writes when the stored password does not already match the secret
      # with its surrounding whitespace removed — the one shape of mismatch a
      # person can hit and a script cannot: a value pasted with a newline is
      # hashed faithfully, sent faithfully by every script since, and cannot be
      # reproduced on a keyboard. When the stored password is already typeable
      # it reports that and changes nothing.
      - name: Compare the operator's password with the current secret
        if: inputs.repair_operator_password
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          SITE_URL: ${{ inputs.site_url }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_PLATFORM_ADMIN_PASSWORD }}
          APPLY: '1'
        run: node tooling/deploy/operator-password.mjs

      - name: Find out why, and check the live path end to end
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          SITE_URL: ${{ inputs.site_url }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PRODUCTION_PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_PLATFORM_ADMIN_PASSWORD }}
        run: node tooling/deploy/verify-operator-login.mjs

      # Review-branch only: dispatched with ref=claude/student-world-review so
      # the live pages can be inspected from somewhere that can reach them.
      # Read-only; signs in to nothing and writes nothing.
      - name: Ask the live site whether the student redesign is served
        env:
          SITE: ${{ inputs.site_url }}
          OPERATOR_USERNAME: operator
          OPERATOR_PASSWORD: ${{ secrets.PRODUCTION_PLATFORM_ADMIN_PASSWORD }}
        run: |
          set -u
          fail=0
          echo "=== routes ==="
          for path in / /login /home /games /messages /dashboard /progress /students /content; do
            code=$(curl -s -o /tmp/p.html -w '%{http_code}' -m 40 "$SITE$path" || echo 000)
            printf '%-12s HTTP %s\n' "$path" "$code"
            case "$path" in
              /login) cp /tmp/p.html /tmp/login.html ;;
              /dashboard|/progress|/students|/content) cp /tmp/p.html "/tmp/t$(echo "$path" | tr / _).html" ;;
            esac
            [ "$code" = "200" ] || fail=1
          done
          echo
          echo "=== approved sign-in wording, live ==="
          for phrase in "Your English Journey" "Starts Here" "Learn, practise, and grow with TOP GOAL." "English Learning with Ms. Najwa Al-Shahrani"; do
            if grep -qF "$phrase" /tmp/login.html; then echo "found: $phrase"; else echo "MISSING: $phrase"; fail=1; fi
          done
          echo
          echo "=== the public page still carries no contact details ==="
          for bad in "wa.me" "whatsapp"; do
            if grep -qiF "$bad" /tmp/login.html; then echo "LEAK: $bad on /login"; fail=1; else echo "absent: $bad"; fi
          done
          # Only the words a visitor can actually read. The built HTML is full
          # of asset hashes and inline JSON, and a digit-run check over all of
          # it says nothing about whether a number is on the page.
          python3 - <<'PYEOF' > /tmp/login.txt
import re
html = open('/tmp/login.html', encoding='utf-8', errors='replace').read()
html = re.sub(r'(?is)<(script|style)\b.*?</\1>', ' ', html)
print(re.sub(r'(?s)<[^>]+>', ' ', html))
PYEOF
          if grep -q -E '\+?[0-9][0-9 ().-]{8,}[0-9]' /tmp/login.txt; then
            echo "LEAK: phone-shaped text a visitor can read:"
            grep -o -E '\+?[0-9][0-9 ().-]{8,}[0-9]' /tmp/login.txt | head -5
            fail=1
          else
            echo "absent: any phone-shaped string in the readable text"
          fi
          if grep -qi 'href="tel:' /tmp/login.html; then echo "LEAK: a tel: link"; fail=1; else echo "absent: any tel: link"; fi

          echo
          echo "=== who may read the teacher contact, on production ==="
          # Nobody signed in at all.
          anon=$(curl -s -o /dev/null -w '%{http_code}' -m 40 "$SITE/api/v1/teachers/mine")
          echo "anonymous GET /teachers/mine -> HTTP $anon"
          case "$anon" in 401|403) ;; *) fail=1 ;; esac
          # Signed in, but not a student: the platform operator.
          jar=$(mktemp)
          # jq builds the JSON so a password containing a quote or a backslash
          # cannot break the body -- the first attempt interpolated it raw and
          # the API answered 400.
          jq -n --arg u "$OPERATOR_USERNAME" --arg p "$OPERATOR_PASSWORD" \
            '{username: $u, password: $p}' > /tmp/creds.json
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' -m 40 -c "$jar" \
            -X POST "$SITE/api/v1/auth/login" -H 'content-type: application/json' \
            --data @/tmp/creds.json)
          rm -f /tmp/creds.json
          if [ "$code" != "200" ]; then echo "  body: $(head -c 200 /tmp/login.json)"; fi
          echo "operator sign-in -> HTTP $code"
          if [ "$code" = "200" ]; then
            op=$(curl -s -o /dev/null -w '%{http_code}' -m 40 -b "$jar" "$SITE/api/v1/teachers/mine")
            echo "operator (not a student) GET /teachers/mine -> HTTP $op"
            [ "$op" = "403" ] || fail=1
            curl -s -o /dev/null -m 40 -b "$jar" -X POST "$SITE/api/v1/auth/logout" || true
          else
            echo "could not sign in as operator; role check not run"; fail=1
          fi
          rm -f "$jar" /tmp/login.json

          echo
          echo "=== stylesheet(s) the deployed build links ==="
          # Next inlines some CSS and links the rest; the path is not fixed, so
          # take every .css the page references and search all of them, plus
          # any inline <style>.
          cp /tmp/login.html /tmp/all.css.txt
          for href in $(grep -o -E '(href|src)="[^"]+\.css[^"]*"' /tmp/login.html | sed -E 's/.*="([^"]+)".*/\1/' | sort -u); do
            case "$href" in http*) url="$href" ;; /*) url="$SITE$href" ;; *) url="$SITE/$href" ;; esac
            echo "fetching $url"
            curl -s -m 40 "$url" >> /tmp/all.css.txt
          done
          echo "searched bytes: $(wc -c < /tmp/all.css.txt)"
          for cls in trailhead signin-panel valley-hold trail-stop trail-mark unit-world games-world q-jump q-pip trail-parts teacher-card wa-button teacher-label signin-by; do
            if grep -qF ".$cls" /tmp/all.css.txt; then echo "present: .$cls"; else echo "MISSING: .$cls"; fail=1; fi
          done

          echo
          echo "=== teacher and admin routes carry no student-world markup ==="
          for f in /tmp/t_dashboard.html /tmp/t_progress.html /tmp/t_students.html /tmp/t_content.html; do
            [ -f "$f" ] || continue
            hits=$(grep -o -E 'class="[^"]*(valley-hold|trail-stop|unit-world|games-world)[^"]*"' "$f" | wc -l)
            printf '%-24s student-world classes: %s\n' "$(basename "$f")" "$hits"
            [ "$hits" = "0" ] || fail=1
          done
          echo
          [ "$fail" = "0" ] && echo "ALL LIVE CHECKS PASSED" || echo "SOME LIVE CHECKS FAILED"
          exit "$fail"
