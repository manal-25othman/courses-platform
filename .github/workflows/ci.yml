name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # A real PostgreSQL, because the tenant isolation tests check what the
      # database does, not what the application intends.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: topgoal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Migrations and fixtures run as the owner.
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/topgoal_test
      OWNER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/topgoal_test
      # The application connects as the restricted role, which the row-level
      # policies actually apply to.
      APP_DATABASE_URL: postgresql://app_user:ci_only_password@localhost:5432/topgoal_test
      DATABASE_URL: postgresql://app_user:ci_only_password@localhost:5432/topgoal_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate database client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # Applies every migration, including the one that switches on row-level
      # security and creates the restricted role.
      - name: Apply migrations
        run: npm run db:deploy -w @courses/api

      - name: Give the restricted role a password
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d topgoal_test \
            -c "ALTER ROLE app_user WITH PASSWORD 'ci_only_password';"

      - name: Tenant isolation tests (real database)
        run: npm run test:db -w @courses/api
